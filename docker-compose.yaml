networks:
    mealprep:
        driver: bridge
        name: mealprep

services:
    mealprep-frontend:
        build:
            context: ..
            dockerfile: mealprep-docker/mealprep-frontend.Dockerfile
        image: "mealprep-frontend:${FRONTEND_VERSION}"
        container_name: "mealprep-frontend"
        environment:
            - REACT_APP_MEALPREP_BACKEND_HOSTNAME=${REACT_APP_MEALPREP_BACKEND_HOSTNAME}
            - REACT_APP_MEALPREP_BACKEND_PORT=${REACT_APP_MEALPREP_BACKEND_PORT}
        ports:
            - "3000:5173"
        depends_on:
            - mealprep-backend
        networks:
            - mealprep
        restart: no

    mealprep-backend:
        build:
            context: ..
            dockerfile: mealprep-docker/mealprep-backend.Dockerfile
        image: "mealprep-backend:${BACKEND_VERSION}"
        container_name: "mealprep-backend"
        environment:
            - DB_HOSTNAME=${DB_HOSTNAME}
            - DB_USER=${DB_USER}
            - DB_PASSWORD=${DB_PASSWORD}
            - DB_NAME=${DB_NAME}
            - DB_PORT=5432
        ports:
            - "8080:8080"
        depends_on:
            - mealprep-db
        networks:
            - mealprep
        restart: no

    mealprep-db:
        build:
            context: ..
            dockerfile: mealprep-docker/mealprep-db.Dockerfile
        image: "postgres:mealprep"
        container_name: "mealprep-db"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
            # - PGUSER=app
            # - PGPASSWORD=app
            - LC_ALL=en_GB.UTF-8
            - LC_CTYPE=en_GB.UTF-8
        volumes:
            - "./database:/var/lib/postgresql/data"
        expose:
            - 5432
        ports:
            - "5432:5432"
        networks:
            - mealprep
        restart: always

    mealprep-minio:
        image: "minio/minio:latest"
        container_name: "mealprep-minio"
        environment:
            - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
            - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - "./minio_data:/data"
        command: minio server /data --console-address ":9001"
        networks:
            - mealprep
        restart: always
